<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masuk — Buku Data Travel Treehouse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body class="login-body">

<div class="login-wrap">
  <div class="login-card">
    <div class="login-mark">🏡</div>
    <h1>Buku Data<br>Travel Treehouse</h1>
    <p class="login-sub">Masuk sebagai admin untuk mengelola data.</p>

    <form id="loginForm">
      <label for="username">Username</label>
      <input type="text" id="username" autocomplete="username" required>

      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" required>

      <div id="loginError" class="login-error" style="display:none;"></div>

      <button type="submit" class="primary" id="loginBtn" style="width:100%; margin-top:16px;">Masuk</button>
    </form>
  </div>
</div>

<script src="/login.js"></script>
</body>
</html>
